# SOURCE OF TRUTH registry — maintained by the SDS Manager team.
#
# ONE project (sdsmanager.com) with multiple PRODUCTS. Each fact may be tagged to a
# product via `product:` (the product NAME; omit for company-wide). Products are seeded
# by migrate (_PRODUCT_SEED): "SDS Manager" (default) and "ExactSDS".
#
# Rule types (field `type`):
#   type: stale      -> stale_patterns raise an issue; current_value is the fix.
#                       With NO patterns it is data-only: read by the LLM pass and by
#                       the product analyzer (languages/regulations are classified there).
#   type: inventory  -> claim_patterns are inventoried site-wide; canonical_value flags
#                       non-matching pages (free, deterministic). Single exact value only.
#
# NOTE: language & regulation counts DIFFER by product and by context, so they are NOT
# plain exact-match rules — src/analysis/products.py classifies each claim by the context
# around it (ExactSDS / SDS-document / inventory-platform) and emits UNCLEAR when a bare
# "N languages" has no single clear context.
#
# Regex is Python `re`, matched case-insensitively.

facts:
  # ==================================================================
  # Company / SDS Manager platform facts
  # ==================================================================
  - id: sds_database_size
    category: database_size
    type: stale
    product: "SDS Manager"
    description: "Number of Safety Data Sheets in the SDS Manager database"
    current_value: "17 million+"
    current_patterns: ["17\\s*(?:M\\b|\\s*million|\\+)"]
    stale_patterns:
      - "\\b1[0-6]\\s*(?:M\\b|million|mill\\b)"
      - "\\b1[0-6][.,]\\d+\\s*(?:M\\b|million)"
    require_context: ["SDS", "safety data sheet", "data sheet", "database", "documents?\\b", "library"]
    context_window: 120
    claim_patterns:
      - "(\\d{1,2}(?:[.,]\\d+)?)\\s*(?:M\\b|million|mill\\b)\\s*(?:\\+\\s*)?(?:SDS|safety data sheet|data sheet|document)"
    severity: high
    notes: "Current figure is 17M+. Historic pages may say 12M/14M/15M/16M."

  - id: positioning
    category: positioning
    type: stale
    product: "SDS Manager"
    description: "SDS Manager is Enterprise-focused, not small-business focused"
    current_value: "Enterprise Solutions focused"
    stale_patterns:
      - "small business(?:es)?"
      - "small organi[sz]ations?"
      - "\\bSMBs?\\b"
      - "small[\\s-]and[\\s-]medium"
      - "small (?:to|&|and) medium"
      - "(?:perfect|ideal|suitable|great|designed) for small"
      - "small (?:teams?|companies|firms|enterprises)"
    severity: high
    notes: "Rewrite to enterprise-focused."

  - id: free_policy
    category: free_claim
    type: stale
    product: "SDS Manager"
    description: "No free plan exists — only a free TRIAL, then paid"
    current_value: "Free trial only (no free plan/version/tier)"
    stale_patterns:
      - "free plan"
      - "free version"
      - "free option"
      - "free (?:forever|tier|account|subscription|edition)"
      - "forever free"
      - "(?:100%|completely|totally|entirely)\\s*free"
      - "free of charge"
      - "free to use"
      - "use (?:it |the app |sds ?manager )?for free"
      - "\\bfor free\\b"
    allowed_patterns: ["free trial", "\\btrial\\b", "\\d+[\\s-]day", "try .{0,30} free"]
    context_window: 80
    severity: critical
    notes: "Distinguish 'free trial' (ok) from 'free plan/option/version' (issue)."

  # ==================================================================
  # Product: SDS Manager
  # ==================================================================
  - id: sdsmanager_inventory_languages
    category: language_count
    type: stale
    product: "SDS Manager"
    description: >-
      SDS Manager platform/inventory interface is available in 32 languages. A number other
      than 32 attached to inventory/platform/interface/UI language claims is wrong.
    current_value: "32"
    search_terms: ["languages in inventory", "platform languages", "interface languages",
                   "40 languages", "36 languages", "29 languages", "available in 32 languages"]
    severity: high
    notes: "Context-classified by src/analysis/products.py (inventory context -> 32)."

  - id: sdsmanager_sds_languages
    category: language_count
    type: stale
    product: "SDS Manager"
    description: >-
      SDS documents (safety data sheets) are supported in 67 languages. A number other than 67
      attached to SDS/safety-data-sheet/document language claims is wrong. A bare 'N languages'
      with no single clear context is UNCLEAR and must be clarified by the team.
    current_value: "67"
    search_terms: ["SDS in 67 languages", "safety data sheets languages", "documents in languages",
                   "40 languages", "50 languages"]
    severity: high
    notes: "Context-classified (SDS context -> 67; no/ambiguous context -> unclear)."

  - id: sdsmanager_regulations
    category: regulation_count
    type: stale
    product: "SDS Manager"
    description: >-
      SDS Manager supports 49 regulations. Any other count of supported regulations is stale.
      (Internal admin reference only: admin55.sdsmanager.com — never crawled/link-checked.)
    current_value: "49"
    search_terms: ["49 regulations", "supported regulations", "20 regulations", "30 regulations",
                   "40 regulations", "50 regulations", "number of regulations"]
    severity: high

  - id: sdsmanager_countries
    category: region_count
    type: inventory
    product: "SDS Manager"
    description: "SDS Manager supports 80 countries. Any other country count is stale/wrong."
    claim_patterns:
      - "(\\d{1,4})\\s*(?:\\+\\s*)?countries\\b"
      - "in\\s*(\\d{1,4})\\s*(?:\\+\\s*)?countries"
    canonical_value: "80"
    search_terms: ["80 countries", "50 countries", "100 countries", "190 countries"]
    severity: high

  - id: sdsmanager_sds_regions
    category: region_count
    type: stale
    product: "SDS Manager"
    description: >-
      Standard supported SDS regions are exactly these 12: EU, China, Australia, New Zealand,
      US, UK, Canada, Switzerland, South Africa, Mexico, Malaysia, Vietnam. Flag pages listing
      a different region set/count, or claiming a region outside this list as standard. Allowed:
      mentions of market-region classification (an SDS may be classified by its market region).
    current_value: >-
      EU, China, Australia, New Zealand, US, UK, Canada, Switzerland, South Africa, Mexico,
      Malaysia, Vietnam (12 standard regions)
    stale_patterns: ["\\b(?!12\\b)\\d{1,2}\\s+(?:sds\\s+)?regions\\b"]
    allowed_patterns: ["market[\\s-]?region", "market region"]
    require_context: ["region"]
    search_terms: ["SDS regions", "supported regions", "10 regions", "15 regions"]
    severity: high

  # ==================================================================
  # Product: ExactSDS (a product of SDS Manager)
  # ==================================================================
  - id: exactsds_languages
    category: language_count
    type: stale
    product: "ExactSDS"
    description: >-
      ExactSDS supports SDS creation and translation in 32 languages. Any other number in an
      ExactSDS language claim is wrong.
    current_value: "32"
    search_terms: ["ExactSDS languages", "ExactSDS 32 languages", "create SDS in languages",
                   "ExactSDS translation languages", "40 languages"]
    severity: high
    notes: "Context-classified (ExactSDS context -> 32)."

  - id: exactsds_regulations
    category: regulation_count
    type: stale
    product: "ExactSDS"
    description: >-
      ExactSDS supports 8 regulations, and the admin Regulation Builder adds new regulations
      with no code changes. Flag other counts, and any claim that ExactSDS regulations are
      fixed/hardcoded/cannot be added to.
    current_value: "8 (extensible via admin Regulation Builder — no code change)"
    search_terms: ["ExactSDS regulations", "ExactSDS 8 regulations", "regulation builder",
                   "fixed regulations", "hardcoded regulations", "10 regulations"]
    severity: high

# Crawl + analysis settings.

crawl:
  concurrency: 8
  request_timeout_s: 20
  max_retries: 3
  retry_base_delay_s: 0.5
  per_worker_delay_s: 0.25          # politeness delay
  user_agent: "SDSManager-InternalAudit/1.0"
  http2: true
  max_redirect_hops: 10
  # On any 429/503: drop to this concurrency and wait the cooldown.
  throttle_concurrency: 2
  throttle_cooldown_s: 60
  # Only these domains are ever fetched (sources on other domains are recorded
  # but not crawled unless explicitly added).
  primary_domain: "sdsmanager.com"
  # Hosts to NEVER crawl or link-check, even though they're on the primary domain
  # (e.g. internal admin panels). Matched exactly or as a parent suffix.
  exclude_hosts:
    - "admin55.sdsmanager.com"

thresholds:
  thin_content_words: 150
  slow_response_ms: 3000

llm:
  base_url: "https://openrouter.ai/api/v1"
  # NOTE: model names are NOT configured here. The single source of truth is the DB
  # (app_settings, edited in Settings). Defaults live in src/config.py (premium only).
  # Per-run CLI override: --fast-model / --reasoning-model (SDS_FAST_MODEL / SDS_REASONING_MODEL).
  max_calls_per_run: 4000                       # hard call guard (per analysis pass)
  max_output_tokens: 2000                       # cap completion tokens (cost guard;
                                                # also avoids 402 "can't afford 65536 tokens")
  max_body_chars: 16000                         # truncate page body for screening
  temperature: 0
  # Locales that get LLM analysis by default. Regex + inventory run on ALL locales.
  english_locales: ["us", "uk", "eu", "au", "ca", "nz"]

cannibalization:
  similarity_threshold: 0.55
  max_pairs_per_locale: 40

paths:
  db: "data/crawl.db"
  html_cache_dir: "data/html"
  output_dir: "output"
